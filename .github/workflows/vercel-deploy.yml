name: Deploy to Vercel

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  # 1. Manual trigger
  workflow_dispatch:

  # 2. Trigger ONLY when a PR targeting main is closed
  push:
    branches:
      - V2/Feature
      - Revamp_V2

jobs:
  Deploy-Production:
    # Run ONLY if: (Manual click on main) OR (PR was successfully merged into main)
    # if: >
    #   (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
    #   (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TEAM_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TEAM_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TEAM_TOKEN }}